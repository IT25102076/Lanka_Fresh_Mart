# ========================
# APPLICATION
# ========================
spring.application.name=Lanka_Fresh_Mart
server.port=8080
spring.config.import=optional:classpath:application-secrets.properties

# ========================
# DATABASE (MySQL)
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/lanka_fresh_mart?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# JPA / HIBERNATE
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================
# THYMELEAF
# ========================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ========================
# FILE UPLOAD
# ========================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# ========================
# MAIL SERVER (Gmail SMTP)
# ========================
