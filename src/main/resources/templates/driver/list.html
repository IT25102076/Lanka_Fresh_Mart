<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main-layout :: html(content=~{::div})}">
<head>
    <title>Manage Drivers - Lanka Fresh Mart</title>
</head>
<body>
    <div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-person-lines-fill"></i> Driver Management</h2>
            <a th:href="@{/drivers/create}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add New Driver</a>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-3">ID</th>
                                <th>Name</th>
                                <th>Contact</th>
                                <th>Vehicle Type</th>
                                <th>Active Assignments</th>
                                <th class="text-end pe-3">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="driver : ${drivers}">
                                <td class="ps-3 fw-bold" th:text="'#' + ${driver.id}">1</td>
                                <td>
                                    <div class="fw-bold" th:text="${driver.name}">Name</div>
                                </td>
                                <td><i class="bi bi-telephone text-muted"></i> <span th:text="${driver.phone}">Phone</span></td>
                                <td>
                                    <span class="badge bg-info text-dark" th:text="${driver.vehicleType}">Van</span>
                                </td>
                                <td>
                                    <div class="small">
                                        Routes: <span class="badge bg-secondary rounded-pill" th:text="${driver.deliveryRoutes.size()}"></span><br>
                                        Single Deliveries: <span class="badge bg-secondary rounded-pill" th:text="${driver.deliveries.size()}"></span>
                                    </div>
                                </td>
                                <td class="text-end pe-3">
                                    <div class="btn-group">
                                        <a th:href="@{/drivers/edit/{id}(id=${driver.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                                        <form th:action="@{/drivers/delete/{id}(id=${driver.id})}" method="post" class="d-inline m-0">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this driver?');"><i class="bi bi-trash"></i></button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(drivers)}">
                                <td colspan="6" class="text-center py-4 text-muted">No drivers found. Add a driver to start dispatching orders!</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
