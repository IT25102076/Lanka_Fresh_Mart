<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main-layout :: html(content=~{::main})}">
<head>
    <title th:text="${driver.id != null ? 'Edit Driver' : 'Add Driver'} + ' - Lanka Fresh Mart'"></title>
</head>
<body>
    <main class="page-content bg-light">
        <div class="container">
            <div class="mb-4">
                <a th:href="@{/drivers}" class="btn-lfm-outline btn-lfm-sm"><i class="bi bi-arrow-left"></i> Back to Drivers</a>
            </div>
            
            <div class="card-lfm mx-auto" style="max-width: 600px;">
                <div class="card-header bg-white d-flex align-items-center">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi bi-person-badge text-primary me-2"></i>
                        <span th:text="${driver.id != null ? 'Edit Driver Details' : 'Register New Driver'}"></span>
                    </h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="${driver.id != null ? '/drivers/edit/' + driver.id : '/drivers/add'}" th:object="${driver}" method="post" class="lfm-form">
                        
                        <!-- Hidden ID field -->
                        <input type="hidden" th:field="*{id}" th:if="${driver.id != null}">
                        
                        <div class="mb-4">
                            <label for="name" class="form-label">Full Name *</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="e.g. Kamal Perera" required>
                        </div>
                        
                        <div class="mb-4">
                            <label for="phone" class="form-label">Phone Number *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-telephone"></i></span>
                                <input type="text" class="form-control border-start-0" id="phone" th:field="*{phone}" placeholder="+94 7X XXX XXXX" required>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label for="vehicleNumber" class="form-label">Vehicle Registration Number *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-truck"></i></span>
                                <input type="text" class="form-control border-start-0 text-uppercase" id="vehicleNumber" th:field="*{vehicleNumber}" placeholder="e.g. WP CAA-1234" required>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label for="status" class="form-label">Driver Status *</label>
                            <select class="form-select" id="status" th:field="*{status}" required>
                                <option th:each="stat : ${T(com.lankafreshmart.lanka_fresh_mart.model.Driver.DriverStatus).values()}" 
                                        th:value="${stat}" th:text="${stat}">Status</option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-end mt-5 pt-3 border-top">
                            <a th:href="@{/drivers}" class="btn btn-light me-3 px-4 border">Cancel</a>
                            <button type="submit" class="btn-lfm-primary">
                                <i class="bi bi-check2-circle me-1"></i> <span th:text="${driver.id != null ? 'Update Driver' : 'Register Driver'}"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
