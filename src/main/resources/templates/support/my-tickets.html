<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main-layout :: html(content=~{::main})}">
<head>
    <title>My Support Tickets - Lanka Fresh Mart</title>
</head>
<body>
    <main class="page-content bg-light">
        <div class="container my-4">
            <div class="page-header mb-4">
                <h2><i class="bi bi-headset"></i> Support Center</h2>
                <!-- Button triggers modal to create a new ticket -->
                <button type="button" class="btn-lfm-primary" data-bs-toggle="modal" data-bs-target="#newTicketModal">
                    <i class="bi bi-plus-lg me-1"></i> New Support Ticket
                </button>
            </div>

            <div th:if="${success}" class="alert-lfm alert-lfm-success mb-4" th:text="${success}"></div>
            <div th:if="${error}" class="alert-lfm alert-lfm-danger mb-4" th:text="${error}"></div>

            <!-- New Ticket Modal -->
            <div class="modal fade" id="newTicketModal" tabindex="-1" aria-labelledby="newTicketModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content border-0" style="border-radius: var(--radius-lg); overflow: hidden;">
                        <div class="modal-header text-white" style="background: linear-gradient(135deg, var(--clr-primary-dark) 0%, var(--clr-primary) 100%);">
                            <h5 class="modal-title fw-bold" id="newTicketModalLabel"><i class="bi bi-envelope-plus me-2"></i>Submit a Request</h5>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <form th:action="@{/support/create}" method="post" class="lfm-form">
                            <div class="modal-body p-4">
                                <div class="mb-3">
                                    <label for="subject" class="form-label">Subject *</label>
                                    <input type="text" class="form-control" id="subject" name="subject" placeholder="e.g. Issue with my recent order" required>
                                </div>
                                <div class="mb-3">
                                    <label for="phoneNumber" class="form-label">Phone Number *</label>
                                    <input type="text" class="form-control" id="phoneNumber" name="phoneNumber" th:value="${user?.phone}" placeholder="e.g. 077 123 4567" required>
                                </div>
                                <div class="mb-3">
                                    <label for="message" class="form-label">Description *</label>
                                    <textarea class="form-control" id="message" name="message" rows="4" placeholder="Please provide details about your issue..." required></textarea>
                                </div>
                            </div>
                            <div class="modal-footer bg-light border-top-0 p-3">
                                <button type="button" class="btn btn-light border px-4" data-bs-dismiss="modal">Cancel</button>
                                <button type="submit" class="btn-lfm-primary"><i class="bi bi-send me-1"></i> Submit Ticket</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Ticket List -->
            <div th:if="${#lists.isEmpty(tickets)}" class="card-lfm empty-state">
                <i class="bi bi-envelope-check empty-icon"></i>
                <h4 class="mt-3">You don't have any support tickets.</h4>
                <p>If you need help, feel free to create a new ticket.</p>
            </div>

            <div class="row g-4">
                <div th:each="ticket : ${tickets}" class="col-md-6">
                    <div class="card-lfm h-100 border-0 shadow-sm" style="transition: transform 0.2s, box-shadow 0.2s;">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div>
                                    <span class="badge bg-light text-secondary border mb-2 px-2 py-1">TICKET-#<span th:text="${ticket.id}"></span></span>
                                    <h5 class="fw-bold mb-1" th:text="${ticket.subject}"></h5>
                                    <div class="small text-muted" th:text="${#temporals.format(ticket.createdAt, 'dd MMM yyyy, HH:mm')}"></div>
                                </div>
                                <span class="badge-lfm" 
                                      th:classappend="${ticket.status.name() == 'OPEN' ? 'badge-lfm-warning' : (ticket.status.name() == 'IN_PROGRESS' ? 'badge-lfm-info' : 'badge-lfm-success')}"
                                      th:text="${ticket.status}">
                                </span>
                            </div>
                            
                            <div class="bg-light rounded p-3 mb-3 text-muted" style="font-size: 0.95rem;">
                                <i class="bi bi-quote fs-4 text-primary opacity-25 float-start me-2"></i>
                                <span th:text="${ticket.message}"></span>
                            </div>

                            <div th:if="${ticket.adminReply}" class="mt-3 border-top pt-3">
                                <div class="fw-bold text-success mb-2"><i class="bi bi-person-fill-gear me-1"></i> Support Response</div>
                                <div class="p-3 bg-success bg-opacity-10 rounded border border-success border-opacity-25" th:text="${ticket.adminReply}"></div>
                            </div>
                            
                            <div th:if="${ticket.status.name() != 'RESOLVED'}" class="mt-3 text-end">
                                <form th:action="@{/support/delete/{id}(id=${ticket.id})}" method="post" data-confirm="Are you sure you wish to delete this support ticket?">
                                    <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash me-1"></i>Delete Ticket</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>
</body>
</html>
