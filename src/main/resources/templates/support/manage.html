<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main-layout :: html(content=~{::div})}">
<head>
    <title>Manage Support Tickets - Lanka Fresh Mart</title>
</head>
<body>
    <div class="container my-5">
        <h2 class="mb-4"><i class="bi bi-kanban"></i> Manage Support Tickets</h2>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Customer</th>
                            <th>Subject & Message</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(tickets)}">
                            <td colspan="6" class="text-center py-4 text-muted">No support tickets found.</td>
                        </tr>
                        <tr th:each="ticket : ${tickets}">
                            <td th:text="${'#' + ticket.id}"></td>
                            <td>
                                <strong th:text="${ticket.customer.firstName + ' ' + ticket.customer.lastName}"></strong><br>
                                <small class="text-muted" th:text="${ticket.customer.email}"></small>
                            </td>
                            <td style="max-width: 300px;">
                                <strong th:text="${ticket.subject}"></strong>
                                <p class="mb-0 text-truncate text-muted small" th:text="${ticket.message}"></p>
                            </td>
                            <td>
                                <span class="badge" 
                                      th:classappend="${ticket.status.name() == 'OPEN' ? 'bg-warning text-dark' : (ticket.status.name() == 'RESOLVED' ? 'bg-success' : 'bg-info')}"
                                      th:text="${ticket.status}">
                                </span>
                            </td>
                            <td th:text="${#temporals.format(ticket.createdAt, 'dd-MM-yyyy HH:mm')}"></td>
                            <td class="text-end">
                                <!-- Reply Button (Triggers Modal) -->
                                <button type="button" class="btn btn-sm btn-primary" data-bs-toggle="modal" th:data-bs-target="'#replyModal' + ${ticket.id}">
                                    Reply
                                </button>
                                
                                <!-- Delete Button -->
                                <form th:action="@{/support/delete/{id}(id=${ticket.id})}" method="post" class="d-inline" onsubmit="return confirm('Are you sure you want to completely delete this ticket?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                                </form>

                                <!-- Reply Modal -->
                                <div class="modal fade text-start" th:id="'replyModal' + ${ticket.id}" tabindex="-1">
                                    <div class="modal-dialog">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title">Reply to Ticket #<span th:text="${ticket.id}"></span></h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                            </div>
                                            <form th:action="@{/support/reply/{id}(id=${ticket.id})}" method="post">
                                                <div class="modal-body">
                                                    <div class="mb-3">
                                                        <label class="form-label text-muted">Customer Message:</label>
                                                        <p class="p-2 bg-light border rounded" th:text="${ticket.message}"></p>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label">Your Reply</label>
                                                        <textarea name="adminReply" class="form-control" rows="4" required th:text="${ticket.adminReply}"></textarea>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label">Update Status</label>
                                                        <select name="status" class="form-select">
                                                            <option value="OPEN" th:selected="${ticket.status.name() == 'OPEN'}">OPEN</option>
                                                            <option value="IN_PROGRESS" th:selected="${ticket.status.name() == 'IN_PROGRESS'}">IN_PROGRESS</option>
                                                            <option value="RESOLVED" th:selected="${ticket.status.name() == 'RESOLVED'}">RESOLVED</option>
                                                        </select>
                                                    </div>
                                                </div>
                                                <div class="modal-footer">
                                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                                    <button type="submit" class="btn btn-primary">Save & Send Reply</button>
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
