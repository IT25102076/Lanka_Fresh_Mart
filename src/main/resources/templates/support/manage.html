<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main-layout :: html(content=~{::main})}">
<head>
    <title>Manage Support - Lanka Fresh Mart</title>
</head>
<body>
    <main class="page-content bg-light">
        <div class="container">
            <div class="page-header">
                <h2><i class="bi bi-kanban"></i> Manage Support Tickets</h2>
            </div>

            <div th:if="${success}" class="alert-lfm alert-lfm-success mb-4" th:text="${success}"></div>
            <div th:if="${error}" class="alert-lfm alert-lfm-danger mb-4" th:text="${error}"></div>

            <div class="card-lfm">
                <div class="card-header bg-white">
                    <h5 class="mb-0 fw-bold">Customer Requests</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table-lfm w-100 mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Ticket ID</th>
                                    <th>Customer</th>
                                    <th>Subject & Details</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="ticket : ${tickets}">
                                    <td class="fw-bold text-muted">#<span th:text="${ticket.id}"></span></td>
                                    <td>
                                        <div class="fw-bold" th:text="${ticket.customer.firstName + ' ' + ticket.customer.lastName}"></div>
                                        <div class="small text-muted" th:text="${ticket.customer.email}"></div>
                                        <div class="small text-muted mt-1"><i class="bi bi-telephone"></i> <span th:text="${ticket.phoneNumber}"></span></div>
                                    </td>
                                    <td style="max-width: 300px;">
                                        <div class="fw-bold text-truncate" th:title="${ticket.subject}" th:text="${ticket.subject}"></div>
                                        <div class="small text-muted text-truncate" th:title="${ticket.message}" th:text="${ticket.message}"></div>
                                        <div class="small text-primary mt-1" th:text="${#temporals.format(ticket.createdAt, 'dd MMM, HH:mm')}"></div>
                                    </td>
                                    <td>
                                        <span class="badge-lfm" 
                                              th:classappend="${ticket.status.name() == 'OPEN' ? 'badge-lfm-warning' : (ticket.status.name() == 'IN_PROGRESS' ? 'badge-lfm-info' : 'badge-lfm-success')}"
                                              th:text="${ticket.status}">
                                        </span>
                                    </td>
                                    <td>
                                        <!-- Only show response form if not resolved -->
                                        <div th:if="${ticket.status.name() != 'RESOLVED'}">
                                            <button type="button" class="btn-lfm-outline btn-lfm-sm" data-bs-toggle="modal" th:data-bs-target="'#respondModal' + ${ticket.id}">
                                                <i class="bi bi-reply"></i> Respond
                                            </button>
                                        </div>
                                        
                                        <div th:if="${ticket.status.name() == 'RESOLVED'}" class="d-flex align-items-center gap-2">
                                            <div class="text-success fw-bold small">
                                                <i class="bi bi-check-circle-fill me-1"></i> Resolved
                                            </div>
                                            <form th:action="@{/support/manage/delete/{id}(id=${ticket.id})}" method="post" onsubmit="return confirm('Delete this resolved ticket?');" class="mb-0">
                                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete Ticket"><i class="bi bi-trash"></i></button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(tickets)}">
                                    <td colspan="5" class="text-center py-5 text-muted">
                                        <div class="empty-state py-0">
                                            <i class="bi bi-envelope-check fs-1 opacity-50 mb-3 d-block"></i>
                                            <h5>All caught up!</h5>
                                            <p>No active support tickets requiring attention.</p>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <!-- Response Modals (rendered outside table to avoid overflow clipping) -->
        <th:block th:each="ticket : ${tickets}">
            <div th:if="${ticket.status.name() != 'RESOLVED'}" class="modal fade" th:id="'respondModal' + ${ticket.id}" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered modal-lg">
                    <div class="modal-content border-0" style="border-radius: var(--radius-lg); overflow: hidden;">
                        <div class="modal-header bg-light">
                            <h5 class="modal-title fw-bold text-primary"><i class="bi bi-chat-dots me-2"></i>Respond to Ticket #<span th:text="${ticket.id}"></span></h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <form th:action="@{/support/reply/{id}(id=${ticket.id})}" method="post" class="lfm-form">
                            <div class="modal-body p-4">
                                <div class="mb-4 bg-white border rounded p-3 shadow-sm">
                                    <h6 class="fw-bold mb-2">Customer Query:</h6>
                                    <p class="mb-0 text-muted" th:text="${ticket.message}"></p>
                                </div>
                                <div class="row">
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label">Update Status</label>
                                        <select name="status" class="form-select">
                                            <option value="OPEN" th:selected="${ticket.status.name() == 'OPEN'}">Open</option>
                                            <option value="IN_PROGRESS" th:selected="${ticket.status.name() == 'IN_PROGRESS'}">In Progress</option>
                                            <option value="RESOLVED" th:selected="${ticket.status.name() == 'RESOLVED'}">Resolved</option>
                                        </select>
                                    </div>
                                    <div class="col-md-8 mb-3">
                                        <label class="form-label">Response Message</label>
                                        <textarea name="adminReply" class="form-control" rows="4" th:text="${ticket.adminReply}" placeholder="Type your response to the customer here..."></textarea>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer bg-light border-top-0 p-3">
                                <button type="button" class="btn btn-light border px-4" data-bs-dismiss="modal">Cancel</button>
                                <button type="submit" class="btn-lfm-primary"><i class="bi bi-send me-1"></i> Send Update</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </th:block>

    </main>
</body>
</html>
