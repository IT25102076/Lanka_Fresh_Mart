<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main-layout :: html(content=~{::main})}">
<head>
    <title>Manage Deliveries - Lanka Fresh Mart</title>
</head>
<body>
    <main class="page-content bg-light" data-ajax-forms th:classappend="${success != null or error != null} ? 'no-animations' : ''">
        <div class="container">
            <div class="page-header">
                <h2><i class="bi bi-truck"></i> Manage Deliveries</h2>
            </div>

            <div th:if="${success}" class="alert-lfm alert-lfm-success mb-4" th:text="${success}"></div>
            <div th:if="${error}" class="alert-lfm alert-lfm-danger mb-4" th:text="${error}"></div>

            <div class="card-lfm">
                <div class="card-header bg-white">
                    <h5 class="mb-0 fw-bold">Active Deliveries</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table-lfm w-100 mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Order ID</th>
                                    <th>Customer</th>
                                    <th>Address</th>
                                    <th>Driver</th>
                                    <th class="text-center">Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="delivery : ${deliveries}">
                                    <td class="fw-bold text-primary">#<span th:text="${delivery.order.id}"></span></td>
                                    <td>
                                        <div class="fw-bold" th:text="${delivery.order.user.firstName + ' ' + delivery.order.user.lastName}"></div>
                                    </td>
                                    <td>
                                        <div style="max-width: 250px;" class="text-truncate" th:title="${delivery.deliveryAddress}" th:text="${delivery.deliveryAddress}"></div>
                                    </td>
                                    <td>
                                        <!-- Auto-submit driver assignment -->
                                        <form th:action="@{/deliveries/update/{id}(id=${delivery.id})}" method="post" class="lfm-form">
                                            <input type="hidden" name="status" th:value="${delivery.status}">
                                            <select name="driverId" class="form-select form-select-sm" style="min-width: 130px; border-radius: var(--radius-pill);" onchange="this.form.requestSubmit()">
                                                <option value="">Unassigned</option>
                                                <option th:each="d : ${drivers}" 
                                                        th:value="${d.id}" 
                                                        th:text="${d.name} + ' (' + ${d.vehicleType} + ')'"
                                                        th:selected="${delivery.driver != null and delivery.driver.id == d.id}">
                                                </option>
                                            </select>
                                        </form>
                                    </td>
                                    <td class="text-center">
                                        <div class="status-cell"><div class="status-pipeline">
                                            <!-- Preparing -->
                                            <form th:action="@{/deliveries/update/{id}(id=${delivery.id})}" method="post" class="m-0">
                                                <input type="hidden" name="status" value="PREPARING">
                                                <input type="hidden" name="driverId" th:value="${delivery.driver?.id}">
                                                <button type="submit" class="btn p-0 border-0 status-step-btn" th:disabled="${delivery.status?.name() == 'PREPARING'}">
                                                    <span class="badge-lfm status-step step-preparing" 
                                                          th:classappend="${delivery.status?.name() == 'PREPARING' ? 'is-current' : ''}">
                                                        PREPARING
                                                    </span>
                                                </button>
                                            </form>
                                            
                                            <i class="bi bi-chevron-right status-chevron"></i>
                                            
                                            <!-- Dispatched -->
                                            <form th:action="@{/deliveries/update/{id}(id=${delivery.id})}" method="post" class="m-0">
                                                <input type="hidden" name="status" value="DISPATCHED">
                                                <input type="hidden" name="driverId" th:value="${delivery.driver?.id}">
                                                <button type="submit" class="btn p-0 border-0 status-step-btn" 
                                                        th:classappend="${delivery.driver == null and delivery.status?.name() != 'DISPATCHED' ? 'is-locked' : ''}"
                                                        th:disabled="${delivery.status?.name() == 'DISPATCHED' or delivery.driver == null}"
                                                        th:title="${delivery.driver == null ? 'Driver required' : ''}">
                                                    <span class="badge-lfm status-step step-dispatched" 
                                                          th:classappend="${delivery.status?.name() == 'DISPATCHED' ? 'is-current' : ''}">
                                                        DISPATCHED
                                                    </span>
                                                </button>
                                            </form>

                                            <i class="bi bi-chevron-right status-chevron"></i>
                                            
                                            <!-- Delivered -->
                                            <form th:action="@{/deliveries/update/{id}(id=${delivery.id})}" method="post" class="m-0">
                                                <input type="hidden" name="status" value="DELIVERED">
                                                <input type="hidden" name="driverId" th:value="${delivery.driver?.id}">
                                                <button type="submit" class="btn p-0 border-0 status-step-btn" 
                                                        th:classappend="${delivery.driver == null and delivery.status?.name() != 'DELIVERED' ? 'is-locked' : ''}"
                                                        th:disabled="${delivery.status?.name() == 'DELIVERED' or delivery.driver == null}"
                                                        th:title="${delivery.driver == null ? 'Driver required' : ''}">
                                                    <span class="badge-lfm status-step step-delivered" 
                                                          th:classappend="${delivery.status?.name() == 'DELIVERED' ? 'is-current' : ''}">
                                                        DELIVERED
                                                    </span>
                                                </button>
                                            </form>
                                        </div></div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(deliveries)}">
                                    <td colspan="6" class="text-center py-5 text-muted">
                                        <div class="empty-state py-0">
                                            <i class="bi bi-truck fs-1 opacity-50 mb-3 d-block"></i>
                                            <h5>No active deliveries</h5>
                                            <p>All orders have been delivered or there are no pending orders.</p>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Status/driver forms are submitted in place by /js/ajax-forms.js (data-ajax-forms) -->
        <script>
            document.addEventListener("DOMContentLoaded", function() {
                // Fix dropdown z-index overlap in tables
                document.addEventListener('show.bs.dropdown', function (e) {
                    var dropdown = e.target.closest('.dropdown');
                    if (dropdown) dropdown.style.zIndex = '1050';
                });
                document.addEventListener('hide.bs.dropdown', function (e) {
                    var dropdown = e.target.closest('.dropdown');
                    if (dropdown) dropdown.style.zIndex = '';
                });
            });
        </script>
    </main>
</body>
</html>
