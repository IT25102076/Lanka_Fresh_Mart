<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main-layout :: html(content=~{::div})}">
<head>
    <title>Finance Dashboard - Lanka Fresh Mart</title>
</head>
<body>
    <div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-graph-up-arrow text-success"></i> Finance Dashboard</h2>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <!-- Summary Cards -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card bg-success text-white shadow-sm h-100">
                    <div class="card-body text-center">
                        <h5 class="card-title">Total Revenue</h5>
                        <h2 class="mb-0">LKR <span th:text="${totalRevenue}"></span></h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-danger text-white shadow-sm h-100">
                    <div class="card-body text-center">
                        <h5 class="card-title">Total Expenses</h5>
                        <h2 class="mb-0">LKR <span th:text="${totalExpenses}"></span></h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-primary text-white shadow-sm h-100">
                    <div class="card-body text-center">
                        <h5 class="card-title">Net Profit</h5>
                        <h2 class="mb-0">LKR <span th:text="${netProfit}"></span></h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Expense Form & List -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-light fw-bold"><i class="bi bi-plus-circle"></i> Log New Expense</div>
                    <div class="card-body">
                        <form th:action="@{/finance/expenses/add}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Description</label>
                                <input type="text" name="description" class="form-control" placeholder="e.g. Driver Fuel, Electricity Bill" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Amount (LKR)</label>
                                <input type="number" step="0.01" name="amount" class="form-control" placeholder="0.00" required>
                            </div>
                            <button type="submit" class="btn btn-danger w-100"><i class="bi bi-cart-dash"></i> Add Expense</button>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-header bg-light fw-bold"><i class="bi bi-list-ul"></i> Expense History</div>
                    <div class="card-body p-0">
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item d-flex justify-content-between align-items-center" th:each="expense : ${expensesList}">
                                <div>
                                    <strong th:text="${expense.description}"></strong><br>
                                    <small class="text-muted" th:text="${#temporals.format(expense.dateAdded, 'dd-MM-yyyy HH:mm')}"></small>
                                </div>
                                <div class="d-flex align-items-center">
                                    <span class="badge bg-danger rounded-pill fs-6 me-3">- LKR <span th:text="${expense.amount}"></span></span>
                                    <button type="button" class="btn btn-sm btn-outline-secondary me-1" data-bs-toggle="modal" th:data-bs-target="'#editExpenseModal' + ${expense.id}">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <form th:action="@{/finance/expenses/delete/{id}(id=${expense.id})}" method="post" class="m-0">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure you want to delete this expense?');">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>

                                <!-- Edit Modal -->
                                <div class="modal fade" th:id="'editExpenseModal' + ${expense.id}" tabindex="-1" aria-hidden="true">
                                    <div class="modal-dialog">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title">Edit Expense</h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                            </div>
                                            <div class="modal-body">
                                                <form th:action="@{/finance/expenses/edit/{id}(id=${expense.id})}" method="post">
                                                    <div class="mb-3">
                                                        <label class="form-label">Description</label>
                                                        <input type="text" name="description" class="form-control" th:value="${expense.description}" required>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label">Amount (LKR)</label>
                                                        <input type="number" step="0.01" name="amount" class="form-control" th:value="${expense.amount}" required>
                                                    </div>
                                                    <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </li>
                            <li class="list-group-item text-center text-muted py-4" th:if="${#lists.isEmpty(expensesList)}">
                                No expenses logged yet.
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Chart.js Visualization -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-light fw-bold"><i class="bi bi-pie-chart"></i> Revenue vs Expenses</div>
                    <div class="card-body d-flex justify-content-center align-items-center">
                        <canvas id="financeChart" style="max-width: 400px; max-height: 400px;"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chart.js Script -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function() {
                var revenue = [[${totalRevenue}]];
                var expenses = [[${totalExpenses}]];
                var profit = [[${netProfit}]];

                var ctx = document.getElementById('financeChart').getContext('2d');
                var financeChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Net Profit', 'Expenses'],
                        datasets: [{
                            data: [profit > 0 ? profit : 0, expenses],
                            backgroundColor: [
                                '#0d6efd', // Primary Blue for profit
                                '#dc3545'  // Danger Red for expenses
                            ],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: 'bottom',
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        let label = context.label || '';
                                        if (label) {
                                            label += ': ';
                                        }
                                        if (context.parsed !== null) {
                                            label += 'LKR ' + context.parsed;
                                        }
                                        return label;
                                    }
                                }
                            }
                        }
                    }
                });
            });
        </script>
    </div>
</body>
</html>
