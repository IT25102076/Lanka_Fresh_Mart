<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main-layout :: html(content=~{::main})}">
<head>
    <title>Finance Dashboard - Lanka Fresh Mart</title>
</head>
<body>
    <main class="page-content bg-light">
        <div class="container">
            <div class="page-header">
                <h2><i class="bi bi-graph-up-arrow"></i> Finance Dashboard</h2>
            </div>

            <!-- Quick Stats -->
            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="stat-card stat-card-green h-100 shadow-sm">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h6 class="card-title mb-0 opacity-75">Total Revenue (LKR)</h6>
                            <i class="bi bi-cash-coin fs-3 opacity-50"></i>
                        </div>
                        <h2 class="mb-0 fw-bold" th:text="${totalRevenue}">0.00</h2>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card stat-card-orange h-100 shadow-sm">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h6 class="card-title mb-0 opacity-75">Pending Refunds (LKR)</h6>
                            <i class="bi bi-hourglass-split fs-3 opacity-50"></i>
                        </div>
                        <h2 class="mb-0 fw-bold" th:text="${pendingRefundsAmount}">0.00</h2>
                        <small class="opacity-75">From <span th:text="${pendingRefundsCount}">0</span> orders</small>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card stat-card-blue h-100 shadow-sm">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h6 class="card-title mb-0 opacity-75">Processed Refunds (LKR)</h6>
                            <i class="bi bi-check-circle fs-3 opacity-50"></i>
                        </div>
                        <h2 class="mb-0 fw-bold" th:text="${processedRefundsAmount}">0.00</h2>
                        <small class="opacity-75">From <span th:text="${processedRefundsCount}">0</span> orders</small>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-lg-12">
                    <div class="card-lfm h-100">
                        <div class="card-header bg-white d-flex justify-content-between align-items-center">
                            <span class="fw-bold"><i class="bi bi-clock-history me-2 text-primary"></i>Recent Transactions</span>
                            <a th:href="@{/finance/refunds}" class="btn-lfm-outline btn-lfm-sm">Manage Refunds</a>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table-lfm w-100 mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Order ID</th>
                                            <th>Date</th>
                                            <th>Status</th>
                                            <th class="text-end">Amount (LKR)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="order : ${recentOrders}">
                                            <td>
                                                <div class="fw-bold text-primary">#<span th:text="${order.id}"></span></div>
                                            </td>
                                            <td th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, HH:mm')}"></td>
                                            <td>
                                                <span class="badge-lfm" 
                                                    th:classappend="${order.status?.name() == 'PENDING' ? 'badge-lfm-warning' : (order.status?.name() == 'CONFIRMED' ? 'badge-lfm-info' : (order.status?.name() == 'DELIVERED' ? 'badge-lfm-success' : (order.status?.name() == 'REFUNDED' ? 'badge-lfm-purple' : 'badge-lfm-danger')))}"
                                                    th:text="${order.status}">
                                                </span>
                                            </td>
                                            <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></td>
                                        </tr>
                                        <tr th:if="${#lists.isEmpty(recentOrders)}">
                                            <td colspan="4" class="text-center py-4 text-muted">No recent transactions found.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
