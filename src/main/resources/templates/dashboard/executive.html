<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main-layout :: html(content=~{::div})}">
<head>
    <title>Executive Dashboard - Lanka Fresh Mart</title>
</head>
<body>
    <div class="container-fluid mt-3 mb-5">
        <h2 class="mb-4"><i class="bi bi-speedometer2"></i> Executive Dashboard</h2>

        <!-- Quick Stats Row -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card bg-primary text-white shadow-sm h-100">
                    <div class="card-body text-center">
                        <i class="bi bi-people fs-1"></i>
                        <h5 class="card-title mt-2">Total Customers</h5>
                        <h2 class="mb-0" th:text="${totalCustomers}"></h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-success text-white shadow-sm h-100">
                    <div class="card-body text-center">
                        <i class="bi bi-cash-coin fs-1"></i>
                        <h5 class="card-title mt-2">Total Revenue</h5>
                        <h2 class="mb-0">LKR <span th:text="${totalRevenue}"></span></h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-info text-white shadow-sm h-100">
                    <div class="card-body text-center">
                        <i class="bi bi-box-seam fs-1"></i>
                        <h5 class="card-title mt-2">Total Products</h5>
                        <h2 class="mb-0" th:text="${totalProducts}"></h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-danger text-white shadow-sm h-100">
                    <div class="card-body text-center">
                        <i class="bi bi-exclamation-triangle fs-1"></i>
                        <h5 class="card-title mt-2">Low Stock Items</h5>
                        <h2 class="mb-0" th:text="${lowStockCount}"></h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts Row -->
        <div class="row">
            <!-- Orders Chart -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-light fw-bold"><i class="bi bi-cart"></i> Order Status Overview</div>
                    <div class="card-body d-flex justify-content-center">
                        <canvas id="orderChart" style="max-height: 350px;"></canvas>
                    </div>
                </div>
            </div>

            <!-- Delivery Chart -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-light fw-bold"><i class="bi bi-truck"></i> Delivery Status Overview</div>
                    <div class="card-body d-flex justify-content-center">
                        <canvas id="deliveryChart" style="max-height: 350px;"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chart.js Scripts -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function() {
                // Fetch data from Thymeleaf
                var orderCounts = [[${orderCounts}]];
                var deliveryCounts = [[${deliveryCounts}]];

                // 1. Order Bar Chart
                var ctxOrder = document.getElementById('orderChart').getContext('2d');
                new Chart(ctxOrder, {
                    type: 'bar',
                    data: {
                        labels: ['Pending', 'Confirmed', 'Cancelled'],
                        datasets: [{
                            label: 'Number of Orders',
                            data: [
                                orderCounts['PENDING'] || 0,
                                orderCounts['CONFIRMED'] || 0,
                                orderCounts['CANCELLED'] || 0
                            ],
                            backgroundColor: [
                                '#ffc107', // Warning Yellow
                                '#198754', // Success Green
                                '#dc3545'  // Danger Red
                            ],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: { precision: 0 } // Integer only
                            }
                        },
                        plugins: {
                            legend: { display: false }
                        }
                    }
                });

                // 2. Delivery Doughnut Chart
                var ctxDelivery = document.getElementById('deliveryChart').getContext('2d');
                new Chart(ctxDelivery, {
                    type: 'doughnut',
                    data: {
                        labels: ['Preparing', 'Dispatched', 'Delivered'],
                        datasets: [{
                            data: [
                                deliveryCounts['PREPARING'] || 0,
                                deliveryCounts['DISPATCHED'] || 0,
                                deliveryCounts['DELIVERED'] || 0
                            ],
                            backgroundColor: [
                                '#0dcaf0', // Info Blue
                                '#fd7e14', // Orange
                                '#198754'  // Success Green
                            ],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { position: 'bottom' }
                        }
                    }
                });
            });
        </script>
    </div>
</body>
</html>
