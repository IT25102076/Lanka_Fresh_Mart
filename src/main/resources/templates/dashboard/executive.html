<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main-layout :: html(content=~{::main})}">
<head>
    <title>Executive Dashboard - Lanka Fresh Mart</title>
</head>
<body>
    <main class="page-content bg-light">
        <div class="container">
            <div class="page-header">
                <h2><i class="bi bi-speedometer2"></i> Executive Dashboard</h2>
            </div>

            <!-- Quick Stats Row -->
            <div class="row g-4 mb-4">
                <div class="col-md-3">
                    <div class="stat-card stat-card-blue h-100 shadow-sm">
                        <div class="d-flex align-items-center justify-content-between mb-3">
                            <h6 class="card-title mb-0 opacity-75">Total Customers</h6>
                            <i class="bi bi-people fs-3 opacity-50"></i>
                        </div>
                        <h2 class="mb-0 fw-bold" th:text="${totalCustomers}">0</h2>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card stat-card-green h-100 shadow-sm">
                        <div class="d-flex align-items-center justify-content-between mb-3">
                            <h6 class="card-title mb-0 opacity-75">Total Revenue (LKR)</h6>
                            <i class="bi bi-cash-coin fs-3 opacity-50"></i>
                        </div>
                        <h2 class="mb-0 fw-bold" th:text="${totalRevenue}">0</h2>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card stat-card-orange h-100 shadow-sm">
                        <div class="d-flex align-items-center justify-content-between mb-3">
                            <h6 class="card-title mb-0 opacity-75">Total Products</h6>
                            <i class="bi bi-box-seam fs-3 opacity-50"></i>
                        </div>
                        <h2 class="mb-0 fw-bold" th:text="${totalProducts}">0</h2>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card stat-card-red h-100 shadow-sm">
                        <div class="d-flex align-items-center justify-content-between mb-3">
                            <h6 class="card-title mb-0 opacity-75">Low Stock Items</h6>
                            <i class="bi bi-exclamation-triangle fs-3 opacity-50"></i>
                        </div>
                        <h2 class="mb-0 fw-bold" th:text="${lowStockCount}">0</h2>
                    </div>
                </div>
            </div>

            <!-- Charts Row -->
            <div class="row g-4">
                <!-- Orders Chart -->
                <div class="col-md-6">
                    <div class="card-lfm h-100">
                        <div class="card-header d-flex align-items-center">
                            <i class="bi bi-cart me-2 text-primary"></i> Order Status Overview
                        </div>
                        <div class="card-body d-flex justify-content-center">
                            <canvas id="orderChart" style="max-height: 300px; width: 100%;"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Delivery Chart -->
                <div class="col-md-6">
                    <div class="card-lfm h-100">
                        <div class="card-header d-flex align-items-center">
                            <i class="bi bi-truck me-2 text-primary"></i> Delivery Status Overview
                        </div>
                        <div class="card-body d-flex justify-content-center">
                            <canvas id="deliveryChart" style="max-height: 300px; width: 100%;"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Chart.js Scripts -->
            <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
            <script th:inline="javascript">
                document.addEventListener('DOMContentLoaded', function() {
                    // Fetch data from Thymeleaf
                    var orderCounts = [[${orderCounts}]];
                    var deliveryCounts = [[${deliveryCounts}]];

                    // Styling configurations matching our design system
                    var chartFontFamily = "'Plus Jakarta Sans', sans-serif";
                    var chartColors = {
                        warning: '#FFC107',
                        success: '#1B5E20',
                        danger: '#D32F2F',
                        info: '#0288D1',
                        accent: '#8BC34A',
                        orange: '#FF7043'
                    };

                    Chart.defaults.font.family = chartFontFamily;
                    Chart.defaults.color = '#5F6B57'; // text-secondary

                    // 1. Order Bar Chart
                    var ctxOrder = document.getElementById('orderChart').getContext('2d');
                    new Chart(ctxOrder, {
                        type: 'bar',
                        data: {
                            labels: ['Pending', 'Confirmed', 'Cancelled/Refunded'],
                            datasets: [{
                                label: 'Number of Orders',
                                data: [
                                    orderCounts['PENDING'] || 0,
                                    orderCounts['CONFIRMED'] || 0,
                                    (orderCounts['CANCELLED'] || 0) + (orderCounts['REFUNDED'] || 0)
                                ],
                                backgroundColor: [
                                    chartColors.warning,
                                    chartColors.success,
                                    chartColors.danger
                                ],
                                borderRadius: 6,
                                borderSkipped: false
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: { precision: 0 }, // Integer only
                                    grid: {
                                        color: '#EEF2EB', // border-light
                                        drawBorder: false
                                    }
                                },
                                x: {
                                    grid: { display: false }
                                }
                            },
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    backgroundColor: '#1A1F16',
                                    padding: 10,
                                    cornerRadius: 8,
                                    titleFont: { size: 14, weight: 'bold' },
                                    bodyFont: { size: 13 }
                                }
                            }
                        }
                    });

                    // 2. Delivery Doughnut Chart
                    var ctxDelivery = document.getElementById('deliveryChart').getContext('2d');
                    new Chart(ctxDelivery, {
                        type: 'doughnut',
                        data: {
                            labels: ['Preparing', 'Dispatched', 'Delivered'],
                            datasets: [{
                                data: [
                                    deliveryCounts['PREPARING'] || 0,
                                    deliveryCounts['DISPATCHED'] || 0,
                                    deliveryCounts['DELIVERED'] || 0
                                ],
                                backgroundColor: [
                                    chartColors.info,
                                    chartColors.orange,
                                    chartColors.success
                                ],
                                borderWidth: 2,
                                borderColor: '#ffffff',
                                hoverOffset: 4
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            cutout: '70%',
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                    labels: {
                                        padding: 20,
                                        usePointStyle: true,
                                        pointStyle: 'circle'
                                    }
                                },
                                tooltip: {
                                    backgroundColor: '#1A1F16',
                                    padding: 10,
                                    cornerRadius: 8,
                                    titleFont: { size: 14, weight: 'bold' },
                                    bodyFont: { size: 13 }
                                }
                            }
                        }
                    });
                });
            </script>
        </div>
    </main>
</body>
</html>
