<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main-layout :: html(content=~{::main})}">
<head>
    <title>Manage Orders - Lanka Fresh Mart</title>
</head>
<body>
    <main class="page-content bg-light" data-ajax-forms th:classappend="${success != null or error != null} ? 'no-animations' : ''">
        <div class="container">
            <div class="page-header">
                <h2><i class="bi bi-list-check"></i> Manage Orders</h2>
            </div>

            <div th:if="${success}" class="alert-lfm alert-lfm-success mb-4" th:text="${success}"></div>
            <div th:if="${error}" class="alert-lfm alert-lfm-danger mb-4" th:text="${error}"></div>

            <div class="card-lfm">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold">All Customer Orders</h5>
                    <!-- Simple filter buttons could go here -->
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table-lfm w-100 mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Order ID</th>
                                    <th>Customer</th>
                                    <th>Date</th>
                                    <th class="text-end">Total Amount (LKR)</th>
                                    <th class="text-center">Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="order : ${orders}">
                                    <td class="fw-bold text-primary">#<span th:text="${order.id}"></span></td>
                                    <td>
                                        <div class="fw-bold" th:text="${order.user.firstName + ' ' + order.user.lastName}"></div>
                                        <div class="small text-muted" th:text="${order.user.email}"></div>
                                    </td>
                                    <td th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, HH:mm')}"></td>
                                    <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></td>
                                    <td class="text-center" th:with="st=${order.status != null ? order.status.name() : 'PENDING'}">
                                        <div class="status-cell">
                                            <!-- Closed orders (off the main path): one bar spanning the whole pipeline -->
                                            <div th:if="${st == 'CANCELLED' or st == 'REFUNDED'}" class="status-pipeline">
                                                <span class="badge-lfm status-step status-step-full is-current"
                                                      th:classappend="${st == 'CANCELLED' ? 'step-cancelled' : 'step-refunded'}">
                                                    <i class="bi me-1" th:classappend="${st == 'CANCELLED' ? 'bi-x-circle-fill' : 'bi-arrow-counterclockwise'}"></i>
                                                    <span th:text="${st}"></span>
                                                </span>
                                            </div>

                                            <!-- Active pipeline -->
                                            <div th:unless="${st == 'CANCELLED' or st == 'REFUNDED'}" class="status-pipeline">
                                                <!-- Pending -->
                                                <button type="button" class="btn p-0 border-0 status-step-btn" disabled>
                                                    <span class="badge-lfm status-step step-pending"
                                                          th:classappend="${st == 'PENDING' ? 'is-current' : ''}">PENDING</span>
                                                </button>

                                                <i class="bi bi-chevron-right status-chevron"></i>

                                                <!-- Confirmed -->
                                                <form th:action="@{/orders/manage/update/{id}(id=${order.id})}" method="post" class="m-0">
                                                    <input type="hidden" name="status" value="CONFIRMED">
                                                    <button type="submit" class="btn p-0 border-0 status-step-btn"
                                                            th:disabled="${st != 'PENDING'}"
                                                            th:title="${st == 'PENDING' ? 'Confirm order' : ''}">
                                                        <span class="badge-lfm status-step step-confirmed"
                                                              th:classappend="${st == 'CONFIRMED' ? 'is-current' : ''}">CONFIRMED</span>
                                                    </button>
                                                </form>

                                                <i class="bi bi-chevron-right status-chevron"></i>

                                                <!-- Delivered -->
                                                <form th:action="@{/orders/manage/update/{id}(id=${order.id})}" method="post" class="m-0">
                                                    <input type="hidden" name="status" value="DELIVERED">
                                                    <button type="submit" class="btn p-0 border-0 status-step-btn"
                                                            th:disabled="${st == 'DELIVERED'}"
                                                            th:title="${st != 'DELIVERED' ? 'Mark delivered' : ''}">
                                                        <span class="badge-lfm status-step step-delivered"
                                                              th:classappend="${st == 'DELIVERED' ? 'is-current' : ''}">DELIVERED</span>
                                                    </button>
                                                </form>
                                            </div>

                                            <!-- Action slot (always reserved so columns line up) -->
                                            <div class="status-action-slot">
                                                <form th:if="${st == 'PENDING' or st == 'CONFIRMED'}" th:action="@{/orders/manage/cancel/{id}(id=${order.id})}" method="post" class="m-0"
                                                      data-confirm="Please confirm order cancellation.">
                                                    <button type="submit" class="status-cancel-btn" title="Cancel order">
                                                        <i class="bi bi-x-lg"></i>
                                                    </button>
                                                </form>
                                                <form th:if="${st == 'CANCELLED' or st == 'REFUNDED'}" th:action="@{/orders/manage/delete/{id}(id=${order.id})}" method="post" class="m-0"
                                                      data-confirm="Are you sure you want to permanently delete this order? This action cannot be undone.">
                                                    <button type="submit" class="status-cancel-btn" title="Delete order" style="color: #dc3545; border: 1px solid #dc3545; background-color: transparent;">
                                                        <i class="bi bi-trash"></i>
                                                    </button>
                                                </form>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(orders)}">
                                    <td colspan="6" class="text-center py-5 text-muted">
                                        <div class="empty-state py-0">
                                            <i class="bi bi-inbox fs-1 opacity-50 mb-3 d-block"></i>
                                            <h5>No orders found</h5>
                                            <p>No customer orders are available in the system yet.</p>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Status/cancel forms are submitted in place by /js/ajax-forms.js (data-ajax-forms) -->
        <script>
            document.addEventListener("DOMContentLoaded", function() {
                // Fix dropdown z-index overlap in tables
                document.addEventListener('show.bs.dropdown', function (e) {
                    var dropdown = e.target.closest('.dropdown');
                    if (dropdown) dropdown.style.zIndex = '1050';
                });
                document.addEventListener('hide.bs.dropdown', function (e) {
                    var dropdown = e.target.closest('.dropdown');
                    if (dropdown) dropdown.style.zIndex = '';
                });
            });
        </script>
    </main>
</body>
</html>
