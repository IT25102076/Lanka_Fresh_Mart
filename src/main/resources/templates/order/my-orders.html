<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main-layout :: html(content=~{::main})}">
<head>
    <title>My Orders - Lanka Fresh Mart</title>
</head>
<body>
    <main class="page-content bg-light" data-ajax-forms th:classappend="${success != null or error != null} ? 'no-animations' : ''">
        <div class="container my-4">
            <div class="page-header">
                <h2><i class="bi bi-box2"></i> My Orders</h2>
                <a th:href="@{/products}" class="btn-lfm-primary"><i class="bi bi-cart-plus me-1"></i> New Order</a>
            </div>

            <div th:if="${success}" class="alert-lfm alert-lfm-success mb-4" th:text="${success}"></div>
            <div th:if="${error}" class="alert-lfm alert-lfm-danger mb-4" th:text="${error}"></div>

            <!-- Filter Tabs -->
            <div th:if="${!#lists.isEmpty(orders)}" class="order-filter-bar mb-4">
                <button class="order-filter-tab active" data-filter="ALL" onclick="filterOrders('ALL', this)">
                    View All
                    <span class="order-filter-count" th:text="${#lists.size(orders)}"></span>
                </button>
                <button class="order-filter-tab" data-filter="PENDING" onclick="filterOrders('PENDING', this)">
                    Pending
                    <span class="order-filter-count" th:text="${#lists.size(orders.?[status?.name() == 'PENDING'])}"></span>
                </button>
                <button class="order-filter-tab" data-filter="CONFIRMED" onclick="filterOrders('CONFIRMED', this)">
                    Confirmed
                    <span class="order-filter-count" th:text="${#lists.size(orders.?[status?.name() == 'CONFIRMED'])}"></span>
                </button>
                <button class="order-filter-tab" data-filter="DELIVERED" onclick="filterOrders('DELIVERED', this)">
                    Delivered
                    <span class="order-filter-count" th:text="${#lists.size(orders.?[status?.name() == 'DELIVERED'])}"></span>
                </button>
                <button class="order-filter-tab" data-filter="CANCELLED_OR_REFUNDED" onclick="filterOrders('CANCELLED_OR_REFUNDED', this)">
                    Cancelled
                    <span class="order-filter-count" th:text="${#lists.size(orders.?[status?.name() == 'CANCELLED' or status?.name() == 'REFUNDED'])}"></span>
                </button>
            </div>

            <!-- Empty State -->
            <div th:if="${#lists.isEmpty(orders)}" class="card-lfm empty-state">
                <i class="bi bi-cart-x empty-icon"></i>
                <h4 class="mt-3">You haven't placed any orders yet.</h4>
                <a th:href="@{/products}" class="btn-lfm-accent mt-3 d-inline-block">Start Shopping</a>
            </div>

            <!-- No-match empty state (hidden by default, shown by JS) -->
            <div id="no-filter-match" class="card-lfm empty-state" style="display: none;">
                <i class="bi bi-funnel empty-icon"></i>
                <h4 class="mt-3">No orders match this filter.</h4>
            </div>

            <!-- Order Cards -->
            <div id="orders-list" class="row g-3">
                <div th:each="order : ${orders}" class="col-12 order-card-wrapper" th:attr="data-status=${order.status?.name()}">
                    <div class="order-card">
                        <!-- Status Accent Strip -->
                        <div class="order-card-accent"
                             th:classappend="${order.status?.name() == 'PENDING' ? 'accent-warning' : (order.status?.name() == 'CONFIRMED' ? 'accent-info' : (order.status?.name() == 'CANCELLED' ? 'accent-danger' : (order.status?.name() == 'REFUNDED' ? 'accent-purple' : 'accent-success')))}"></div>

                        <!-- Order Header -->
                        <div class="order-card-header">
                            <div class="d-flex align-items-center gap-3">
                                <div class="order-id-chip">
                                    <i class="bi bi-receipt"></i>
                                    <span class="fw-bold" th:text="'#' + ${order.id}"></span>
                                </div>
                                <div>
                                    <div class="fw-semibold" style="font-size: 0.88rem;" th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, HH:mm')}"></div>
                                    <div class="text-muted" style="font-size: 0.78rem;" th:text="${#lists.size(order.items)} + ' item' + (${#lists.size(order.items)} > 1 ? 's' : '')"></div>
                                </div>
                            </div>

                            <div class="d-flex align-items-center gap-3">
                                <div class="order-total">
                                    <span class="order-total-label">Total</span>
                                    <span class="order-total-value" th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)} + ' LKR'"></span>
                                </div>
                                <span class="badge-lfm" 
                                      th:classappend="${order.status?.name() == 'PENDING' ? 'badge-lfm-warning' : (order.status?.name() == 'CONFIRMED' ? 'badge-lfm-info' : (order.status?.name() == 'CANCELLED' ? 'badge-lfm-danger' : (order.status?.name() == 'REFUNDED' ? 'badge-lfm-purple' : 'badge-lfm-success')))}"
                                      th:text="${order.status}">
                                </span>
                            </div>
                        </div>

                        <!-- Collapsible Item Preview -->
                        <div class="order-items-preview">
                            <button class="order-items-toggle" type="button" 
                                    th:attr="data-bs-toggle='collapse', data-bs-target='#items-' + ${order.id}"
                                    aria-expanded="false">
                                <span class="d-flex align-items-center gap-2">
                                    <i class="bi bi-bag me-1" style="color: var(--clr-primary);"></i>
                                    <span class="order-thumb-strip">
                                        <span th:each="item, itemStat : ${order.items}" th:if="${itemStat.index < 4}">
                                            <img th:if="${item.product.imageUrl}" th:src="${item.product.imageUrl}" class="order-thumb">
                                            <span th:unless="${item.product.imageUrl}" class="order-thumb order-thumb-placeholder"><i class="bi bi-image"></i></span>
                                        </span>
                                        <span th:if="${#lists.size(order.items) > 4}" class="order-thumb order-thumb-more" th:text="'+' + (${#lists.size(order.items)} - 4)"></span>
                                    </span>
                                    <span class="text-muted" style="font-size: 0.82rem;">View Items</span>
                                </span>
                                <i class="bi bi-chevron-down order-toggle-icon"></i>
                            </button>
                            <div class="collapse" th:id="'items-' + ${order.id}">
                                <div th:each="item : ${order.items}" class="order-item-row">
                                    <div class="d-flex align-items-center gap-3">
                                        <img th:if="${item.product.imageUrl}" th:src="${item.product.imageUrl}" class="order-item-img">
                                        <div th:unless="${item.product.imageUrl}" class="order-item-img-placeholder">
                                            <i class="bi bi-image text-muted"></i>
                                        </div>
                                        <div class="flex-grow-1">
                                            <div class="fw-semibold" style="font-size: 0.88rem;" th:text="${item.product.name}"></div>
                                            <div class="text-muted" style="font-size: 0.78rem;">
                                                <span th:text="${#numbers.formatDecimal(item.priceAtTime, 1, 2)} + ' LKR'"></span>
                                                <span class="mx-1">×</span>
                                                <span th:text="${item.quantity}"></span>
                                            </div>
                                        </div>
                                        <div class="fw-bold" style="font-size: 0.88rem;" th:text="${#numbers.formatDecimal(item.priceAtTime * item.quantity, 1, 2)} + ' LKR'"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Order Footer Actions -->
                        <div class="order-card-footer">
                            <div class="d-flex align-items-center gap-2">
                                <a th:if="${order.status?.name() != 'CANCELLED' and order.status?.name() != 'REFUNDED'}" 
                                   th:href="@{/deliveries/track(orderId=${order.id})}" class="btn-lfm-primary btn-lfm-sm">
                                    <i class="bi bi-geo-alt me-1"></i> Track Order
                                </a>
                                <a th:if="${order.status?.name() == 'CANCELLED' or order.status?.name() == 'REFUNDED'}" 
                                   th:href="@{/deliveries/track(orderId=${order.id})}" class="btn-lfm-danger btn-lfm-sm">
                                    <i class="bi bi-arrow-repeat me-1"></i> View Refund Status
                                </a>
                            </div>
                            <div>
                                <form th:if="${order.status?.name() == 'PENDING'}" 
                                      th:action="@{/orders/my-orders/cancel/{id}(id=${order.id})}" method="post" 
                                      data-confirm="Please confirm order cancellation. This action cannot be undone." class="m-0">
                                    <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-3" style="font-weight: 600; font-size: 0.82rem;">
                                        <i class="bi bi-x-circle me-1"></i> Cancel
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    <script th:inline="javascript">
        function filterOrders(status, btn) {
            // Update active tab
            document.querySelectorAll('.order-filter-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');

            // Filter cards
            const cards = document.querySelectorAll('.order-card-wrapper');
            let visible = 0;

            cards.forEach(card => {
                const cardStatus = card.dataset.status;
                if (status === 'ALL' || cardStatus === status || (status === 'CANCELLED_OR_REFUNDED' && (cardStatus === 'CANCELLED' || cardStatus === 'REFUNDED'))) {
                    card.style.display = '';
                    card.style.animation = 'slideUp 0.35s ease-out both';
                    card.style.animationDelay = (visible * 0.06) + 's';
                    visible++;
                } else {
                    card.style.display = 'none';
                    card.style.animation = '';
                }
            });

            // Show/hide no-match state
            document.getElementById('no-filter-match').style.display = visible === 0 ? '' : 'none';
        }
    </script>
    </main>
</body>
</html>
