<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main-layout :: html(content=~{::div})}">
<head>
    <title>My Orders - Lanka Fresh Mart</title>
</head>
<body>
    <div class="container my-5">
        <h2 class="mb-4"><i class="bi bi-box2"></i> My Order History</h2>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div th:if="${#lists.isEmpty(orders)}" class="text-center py-5">
            <i class="bi bi-cart-x fs-1 text-muted"></i>
            <h4 class="mt-3">You haven't placed any orders yet.</h4>
            <a th:href="@{/products}" class="btn btn-primary mt-3">Start Shopping</a>
        </div>

        <div th:each="order : ${orders}" class="card shadow-sm mb-4">
            <div class="card-header bg-light d-flex justify-content-between align-items-center">
                <div>
                    <strong>Order #<span th:text="${order.id}"></span></strong><br>
                    <small class="text-muted" th:text="${#temporals.format(order.createdAt, 'dd-MM-yyyy HH:mm')}"></small>
                </div>
                <div>
                    <span class="badge fs-6" 
                          th:classappend="${order.status.name() == 'PENDING' ? 'bg-warning text-dark' : (order.status.name() == 'CONFIRMED' ? 'bg-info' : 'bg-danger')}"
                          th:text="${order.status}">
                    </span>
                </div>
            </div>
            <div class="card-body p-0">
                <table class="table table-borderless mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Item</th>
                            <th class="text-center">Qty</th>
                            <th class="text-end">Total (LKR)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${order.items}">
                            <td>
                                <img th:if="${item.product.imageUrl}" th:src="${item.product.imageUrl}" width="40" height="40" class="rounded me-2" style="object-fit: cover;">
                                <span th:text="${item.product.name}"></span>
                            </td>
                            <td class="text-center" th:text="${item.quantity}"></td>
                            <td class="text-end" th:text="${item.priceAtTime * item.quantity}"></td>
                        </tr>
                    </tbody>
                    <tfoot class="table-light fw-bold">
                        <tr>
                            <td colspan="2" class="text-end">Order Total:</td>
                            <td class="text-end text-primary" th:text="${order.totalAmount}"></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
            <div class="card-footer bg-white text-end" th:if="${order.status.name() == 'PENDING'}">
                <!-- Customer can only cancel if PENDING -->
                <form th:action="@{/orders/my-orders/cancel/{id}(id=${order.id})}" method="post" onsubmit="return confirm('Are you sure you want to cancel this order? This cannot be undone.');">
                    <button type="submit" class="btn btn-outline-danger"><i class="bi bi-x-circle"></i> Cancel Order</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
