<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main-layout :: html(content=~{::main})}">
<head>
    <title>Manage Products - Lanka Fresh Mart</title>
</head>
<body>
    <main class="page-content bg-light">
        <div class="container">
            <div class="page-header">
                <h2><i class="bi bi-box-seam"></i> Manage Products</h2>
                <a th:href="@{/products/manage/add}" class="btn-lfm-primary"><i class="bi bi-plus-lg me-1"></i> Add New Product</a>
            </div>

            <div th:if="${success}" class="alert-lfm alert-lfm-success mb-4" th:text="${success}"></div>
            <div th:if="${error}" class="alert-lfm alert-lfm-danger mb-4" th:text="${error}"></div>

            <div class="card-lfm">
                <div class="card-header bg-white">
                    <h5 class="mb-0 fw-bold">Product Inventory</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table-lfm w-100 mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Image</th>
                                    <th>Name</th>
                                    <th>Category</th>
                                    <th>Price (LKR)</th>
                                    <th>Stock</th>
                                    <th>Status</th>
                                    <th class="text-center">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="product : ${products}">
                                    <td class="fw-bold text-muted" th:text="${product.id}"></td>
                                    <td>
                                        <img th:if="${product.imageUrl}" th:src="${product.imageUrl}" class="rounded shadow-sm" style="width: 48px; height: 48px; object-fit: cover;">
                                        <div th:unless="${product.imageUrl}" class="bg-light rounded d-flex justify-content-center align-items-center text-muted" style="width: 48px; height: 48px;">
                                            <i class="bi bi-image"></i>
                                        </div>
                                    </td>
                                    <td class="fw-bold" th:text="${product.name}"></td>
                                    <td>
                                        <span class="badge bg-secondary opacity-75" th:text="${product.category}"></span>
                                    </td>
                                    <td class="fw-bold text-success" th:text="${#numbers.formatDecimal(product.price, 1, 2)}"></td>
                                    <td>
                                        <div th:text="${product.quantityOnHand} + ' ' + ${product.unit}"></div>
                                        <small class="text-danger fw-bold" th:if="${product.quantityOnHand <= product.reorderLevel}">
                                            <i class="bi bi-exclamation-triangle-fill"></i> Low Stock
                                        </small>
                                    </td>
                                    <td>
                                        <span class="badge-lfm" 
                                              th:classappend="${product.availability.name() == 'IN_STOCK' ? 'badge-lfm-success' : 'badge-lfm-danger'}"
                                              th:text="${product.availability}">
                                        </span>
                                    </td>
                                    <td class="text-center">
                                        <div class="btn-group">
                                            <a th:href="@{/products/manage/edit/{id}(id=${product.id})}" class="btn btn-sm btn-outline-primary" title="Edit">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <form th:action="@{/products/manage/delete/{id}(id=${product.id})}" method="post" class="d-inline" data-confirm="Please confirm the deletion of this product.">
                                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(products)}">
                                    <td colspan="8" class="text-center py-5">
                                        <div class="empty-state py-0">
                                            <i class="bi bi-box-seam fs-1 text-muted opacity-50 mb-3 d-block"></i>
                                            <h5>No products found</h5>
                                            <p class="text-muted">Start building your inventory by adding a new product.</p>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
