<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main-layout :: html(content=~{::div})}">
<head>
    <title>Manage Products - Lanka Fresh Mart</title>
</head>
<body>
    <div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Product Management</h2>
            <a th:href="@{/products/manage/add}" class="btn btn-primary">Add New Product</a>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>Code</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Price (LKR)</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="product : ${products}">
                            <td th:text="${product.productCode}">PRD-123</td>
                            <td th:text="${product.name}">Apple</td>
                            <td th:text="${product.category}">FRUITS</td>
                            <td th:text="${#numbers.formatDecimal(product.price, 1, 2)}">150.00</td>
                            <td>
                                <span th:text="${product.quantityOnHand}">100</span> 
                                <span th:text="${product.unit}">kg</span>
                            </td>
                            <td>
                                <span th:if="${product.availability.name() == 'AVAILABLE'}" class="badge bg-success">Available</span>
                                <span th:if="${product.availability.name() == 'UNAVAILABLE'}" class="badge bg-danger">Unavailable</span>
                            </td>
                            <td>
                                <a th:href="@{/products/manage/edit/{id}(id=${product.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                                <form th:action="@{/products/manage/delete/{id}(id=${product.id})}" method="post" class="d-inline" onsubmit="return confirm('Are you sure you want to delete this product?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(products)}">
                            <td colspan="7" class="text-center text-muted">No products found. Add a new product to get started.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
